<style>

  label{font-size:.85rem;color:var(--muted);}

    background:#0b1220;color:var(--fg);cursor:pointer;}
  button.primary{background:var(--accent);color:#06283d;border:none;font-weight:700;}
  button:disabled{opacity:.4;cursor:not-allowed;}

  .choice.correct{color:#fff;}
  .choice.wrong{color:#fff;}
  .bar{height:8px;background:#0b1220;border-radius:999px;overflow:hidden;margin:10px 0;}
  .bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s;}
  .stat{display:flex;gap:16px;font-size:.85rem;color:var(--muted);flex-wrap:wrap;}
  .stat b{color:var(--fg);}
  .qcat{display:inline-block;font-size:.7rem;color:var(--accent);border:1px solid var(--accent);
    border-radius:999px;padding:1px 8px;margin-bottom:8px;}
  .qtext{font-size:1.1rem;font-weight:700;margin:4px 0 14px;}
  .choices{display:flex;flex-direction:column;gap:10px;}
  .choice{text-align:left;padding:12px 14px;border:1px solid var(--border);border-radius:10px;
    background:#0b1220;color:var(--fg);cursor:pointer;transition:.15s;}
  .choice:hover:not(:disabled){border-color:var(--accent);}
  .choice.correct{border-color:var(--ok);background:rgba(34,197,94,.15);}
  .choice.wrong{border-color:var(--ng);background:rgba(239,68,68,.15);}
  .explain{margin-top:14px;padding:12px;border-left:3px solid var(--accent);background:#0b1220;
    border-radius:0 8px 8px 0;font-size:.9rem;display:none;}
  .explain.show{display:block;}
  .center{text-align:center;}
  .big{font-size:2rem;font-weight:800;}
  .hidden{display:none;}
  .finish-cat{font-size:.85rem;color:var(--muted);margin-top:12px;text-align:left;}
  .finish-cat div{margin:2px 0;}
</style>

<div class="wrap">
  <h1>☁️ SAP-C02 サービス名クイズ</h1>
  <div class="sub">「このサービスは何をする？」を4択で。AWS Solutions Architect Professional 対策の基礎編。</div>

  <!-- スタート画面 -->
  <div id="start" class="panel">
    <div class="row" style="margin-bottom:12px;">

    </div>
    <div class="row" style="margin-bottom:12px;">
      <label>モード</label>
      <select id="modeSel">
        <option value="normal" selected>通常（出題数ぶん解く）</option>
        <option value="survival">サバイバル（1問間違えるまで）</option>
      </select>
    </div>
    <div class="row" style="margin-bottom:12px;">
      <label>カテゴリ</label>
      <select id="catSel"></select>
      <label id="countLabel">出題数</label>
      <select id="countSel">
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="0" selected>全部</option>
      </select>
    </div>
    <div class="row">
      <button class="primary" id="startBtn">スタート ▶</button>
      <span class="sub" id="poolInfo"></span>
    </div>
  </div>

  <!-- クイズ画面 -->
  <div id="quiz" class="panel hidden">
    <div class="stat">
      <span>進捗 <b id="prog">0 / 0</b></span>
      <span>正解 <b id="score">0</b></span>
      <span>正答率 <b id="rate">0%</b></span>
    </div>
    <div class="bar"><i id="progbar"></i></div>
    <div class="qcat" id="qcat"></div>
    <div class="qtext" id="qtext"></div>
    <div class="choices" id="choices"></div>
    <div class="explain" id="explain"></div>
    <div class="row" style="margin-top:14px;">
      <button class="primary hidden" id="nextBtn">次へ ▶</button>
      <button id="quitBtn">ここまでで結果を見る</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="result" class="panel hidden center">
    <div class="sub">結果</div>
    <div class="big" id="finalRate">0%</div>
    <div id="finalScore" class="sub"></div>
    <div class="finish-cat" id="catBreak"></div>
    <div class="row center" style="justify-content:center;margin-top:16px;">
      <button class="primary" id="retryWrongBtn">間違いだけ復習 🔁</button>
      <button id="againBtn">最初から</button>
    </div>
  </div>

  <!-- 学習データ（マイデータ） -->
  <div id="mydata" class="panel">
    <div class="row" style="justify-content:space-between;">
      <strong>📊 マイ学習データ</strong>
      <span class="sub" id="dataSummary"></span>
    </div>
    <div class="bar"><i id="overallbar" style="background:var(--ok)"></i></div>
    <div id="analysis" class="finish-cat"></div>
    <div class="row" style="margin-top:14px;">
      <button id="analyzeBtn">弱点を分析 🔍</button>
      <button id="exportBtn">データ書き出し（JSON）💾</button>
      <button id="clearBtn" style="border-color:var(--ng);color:var(--ng)">履歴を消す 🗑</button>
    </div>
    <div class="sub" style="margin-top:8px;">回答は自動でこのブラウザに記録されます（localStorage）。分析は「書き出したJSON」を渡せば、より深く見られます。</div>
  </div>

</div>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('quizdata').textContent);
  const all = DATA.questions;

  // ===== クラウド同期（任意）=====
  // WebアプリのURL（GAS or Cloudflare Worker）を入れると、1問ごとに回答をクラウドへ自動送信する。
  // 空のままなら送信しない（localStorageのみ）＝友達配布版はこのまま空で配れる。
  const SYNC_URL = 'https://still-dust-e041.yuvegbsiu36.workers.dev/';                 // ← ここに受け口のURLを貼る（自分用のときだけ）
  const DEVICE  = 'phone';             // このHTMLを使う端末の名札（例: 'phone' / 'pc'）。分析で端末を区別できる
  const QUEUE_KEY = 'sap_c02_quiz_queue_v1';   // 未送信レコードの一時置き場

  // ===== 利用者名（誰のデータか・自由入力）=====
  // 初回に入力した名前をこのブラウザに保存し、以降は保持する。回答レコードに user として付ける。
  const USER_KEY = 'sap_c02_quiz_user_v1';
  function loadUser(){ try{ return localStorage.getItem(USER_KEY) || ''; }catch(e){ return ''; } }
  function saveUser(name){ try{ localStorage.setItem(USER_KEY, name); }catch(e){} }

  function loadQueue(){ try{ return JSON.parse(localStorage.getItem(QUEUE_KEY)) || []; }catch(e){ return []; } }
  function saveQueue(q){ try{ localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }catch(e){} }

  // 未送信キューをまとめて送る。1件ずつ送って成功したものだけキューから外す（通信途切れに強い）
  async function flushQueue(){
    if(!SYNC_URL) return;
    let q = loadQueue();
    if(q.length === 0) return;
    const remain = [];
    for(const rec of q){
      try{
        // GASはプリフライトを嫌うので text/plain で送る（CORS回避の定番）
        const res = await fetch(SYNC_URL, {
          method:'POST',
          headers:{'Content-Type':'text/plain;charset=utf-8'},
          body: JSON.stringify(rec)
        });
        if(!res.ok) throw new Error('status '+res.status);
      }catch(e){
        remain.push(rec);   // 失敗（オフライン/電波切れ）→ 残して次回再送
      }
    }
    saveQueue(remain);
  }

  // 回答1件をキューに積んで即送信を試す（失敗してもキューに残るので取りこぼさない）
  function enqueueSync(rec){
    if(!SYNC_URL) return;
    const q = loadQueue();
    q.push(rec);
    saveQueue(q);
    flushQueue();
  }

  // オンライン復帰時・起動時にも未送信ぶんを再送（通勤中トンネル対策）
  window.addEventListener('online', flushQueue);
  flushQueue();

  // ===== 学習データ記録（localStorage）=====
  const LS_KEY = 'sap_c02_quiz_log_v1';
  function loadLog(){
    try{ return JSON.parse(localStorage.getItem(LS_KEY)) || []; }
    catch(e){ return []; }
  }
  function saveLog(log){
    try{ localStorage.setItem(LS_KEY, JSON.stringify(log)); }catch(e){}
  }
  // 1問回答するたびに1レコード追記
  function recordAnswer(q, chosen, correct){
    const log = loadLog();
    const rec = {
      rid: (Date.now().toString(36) + Math.random().toString(36).slice(2,8)), // 一意ID（二重送信の排除用）
      t: Date.now(),
      id: q.id,
      cat: q.cat,
      svc: q.svc,
      correct: correct,
      chosenSvc: chosen ? chosen.svc : null,   // 選んだ誤答が何のサービスか（取り違え分析用）
      mode: mode,
      device: DEVICE,                           // どの端末で解いたか
      user: loadUser()                          // 誰が解いたか（自由入力の名前・分析でアカウント別に見る）
    };
    log.push(rec);
    saveLog(log);
    enqueueSync(rec);                           // クラウドへ送信（SYNC_URL未設定なら何もしない）
  }

  // カテゴリ選択肢
  const cats = [...new Set(all.map(q=>q.cat))];
  const catSel = document.getElementById('catSel');
  catSel.innerHTML = '<option value="__all__">すべて ('+all.length+'問)</option>' +
    cats.map(c=>'<option value="'+c+'">'+c+' ('+all.filter(q=>q.cat===c).length+'問)</option>').join('');

  const el = id=>document.getElementById(id);
  let pool=[], idx=0, score=0, wrong=[], answered=false, answeredCount=0, mode='normal';

  // 名前欄：保存済みの名前を復元し、入力のたびに保存
  el('userNameInput').value = loadUser();
  el('userNameInput').addEventListener('input', e=>saveUser(e.target.value.trim()));

  function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

  function updatePoolInfo(){
    const c=catSel.value;
    const n=(c==='__all__')?all.length:all.filter(q=>q.cat===c).length;
    el('poolInfo').textContent = '対象 '+n+'問';
  }
  catSel.addEventListener('change',updatePoolInfo);
  updatePoolInfo();

  function syncMode(){
    const sv = el('modeSel').value==='survival';
    el('countSel').disabled = sv;              // サバイバルは出題数無関係
    el('countLabel').style.opacity = sv ? .4 : 1;
    el('poolInfo').textContent = sv
      ? '対象から1問ずつ出し、間違えたら終了'
      : (function(){const c=catSel.value;const n=(c==='__all__')?all.length:all.filter(q=>q.cat===c).length;return '対象 '+n+'問';})();
  }
  el('modeSel').addEventListener('change',syncMode);
  catSel.addEventListener('change',()=>{ if(el('modeSel').value==='survival') syncMode(); });
  syncMode();

  function buildPool(){
    const c=catSel.value;
    let base=(c==='__all__')?all:all.filter(q=>q.cat===c);
    base=shuffle(base);
    if(mode==='survival') return base; // サバイバルは出題数無視で全問から出し続ける
    const cnt=parseInt(el('countSel').value,10);
    if(cnt>0) base=base.slice(0,cnt);
    return base;
  }

  function start(list){
    pool=list; idx=0; score=0; wrong=[]; answered=false; answeredCount=0;
    el('start').classList.add('hidden');
    el('result').classList.add('hidden');
    el('mydata').classList.add('hidden');
    el('quiz').classList.remove('hidden');
    render();
  }

  function render(){
    answered=false;
    const q=pool[idx];
    el('qcat').textContent=q.cat;
    el('qtext').textContent=q.q;
    el('prog').textContent=(idx+1)+' / '+pool.length;
    el('score').textContent=score;
    el('rate').textContent=(answeredCount===0?0:Math.round(score/answeredCount*100))+'%';
    el('progbar').style.width=((idx)/pool.length*100)+'%';
    el('explain').classList.remove('show');
    el('nextBtn').classList.add('hidden');

    // 選択肢をシャッフルして表示（正解位置を毎回変える）
    const order=shuffle(q.choices.map((c,i)=>({c,i})));
    const box=el('choices'); box.innerHTML='';
    order.forEach(o=>{
      const b=document.createElement('button');
      b.className='choice'; b.textContent=o.c.text;
      b.dataset.svc=o.c.svc; b.dataset.text=o.c.text;
      b.dataset.isanswer = (o.i===q.answer) ? '1' : '';
      b.onclick=()=>pick(b,o.i===q.answer,q,o.c);
      box.appendChild(b);
    });
  }

  function pick(btn,correct,q,chosen){
    if(answered) return;
    answered=true;
    answeredCount++;
    const correctText=q.choices[q.answer].text;
    const buttons=el('choices').querySelectorAll('.choice');
    buttons.forEach(b=>{
      b.disabled=true;
      const isAns = b.dataset.isanswer==='1';
      const isChosen = (b===btn);
      if(isAns) b.classList.add('correct');
      if(isChosen && !correct) b.classList.add('wrong');
      // 全選択肢に「= 何のサービスか」を付ける（1問で4サービス学べる）
      const tag = document.createElement('span');
      tag.style.cssText='display:block;margin-top:6px;font-size:.82rem;color:var(--fg);';
      tag.innerHTML='＝ <b style="color:'+(isAns?'var(--ok)':'var(--accent)')+'">'+b.dataset.svc+'</b>'
        + (isAns?' ✅ これが正解':'')
        + (isChosen&&!correct?' ← あなたの回答':'');
      b.appendChild(tag);
    });
    if(correct){ score++; }
    else{ wrong.push(q); }
    recordAnswer(q, chosen, correct);   // 学習データへ1問分を記録
    el('score').textContent=score;
    const ex=el('explain');
    ex.innerHTML='<b>'+q.svc+'</b> ＝ '+correctText+(correct?' ✅ 正解':' ❌ 不正解');
    ex.classList.add('show');
    const survivalDead = (mode==='survival' && !correct);
    const nb=el('nextBtn');
    nb.textContent = survivalDead ? '結果を見る ▶' : '次へ ▶';
    nb.dataset.dead = survivalDead ? '1' : '';
    nb.classList.remove('hidden');
    el('progbar').style.width=((idx+1)/pool.length*100)+'%';
  }

  function next(){
    if(el('nextBtn').dataset.dead==='1'){ finish(); return; } // サバイバル敗退
    idx++;
    if(idx>=pool.length){ finish(); }
    else render();
  }

  function finish(){
    el('quiz').classList.add('hidden');
    el('result').classList.remove('hidden');
    el('mydata').classList.remove('hidden');
    refreshDataSummary();
    const done=answeredCount;
    const total=pool.length;

    // サバイバルモード: 連続正解数(ストリーク)を主役に表示
    if(mode==='survival'){
      el('finalRate').textContent=score+' 連続';
      const cleared = (score===total); // 全問正解で生き残り切った
      if(done===0){
        el('finalScore').textContent='1問も回答していません';
      }else if(cleared){
        el('finalScore').textContent='🏆 全'+total+'問を1問も間違えず完走！';
      }else{
        el('finalScore').textContent=score+'問 連続正解で終了（'+(score+1)+'問目で不正解）';
      }
      const wrongByCat={};
      wrong.forEach(q=>{wrongByCat[q.cat]=(wrongByCat[q.cat]||0)+1;});
      const cb=el('catBreak');
      cb.innerHTML = wrong.length===0
        ? '<div>🎉 ノーミス！</div>'
        : '<div>最後に間違えた問題のカテゴリ:</div>'+Object.entries(wrongByCat).map(([c,n])=>'<div>・'+c+'</div>').join('');
      el('retryWrongBtn').style.display = wrong.length? '' : 'none';
      return;
    }

    // 通常モード（中断対応: 分母は実際に回答した問数）
    const partial = done < total;
    const rate=done?Math.round(score/done*100):0;
    el('finalRate').textContent=rate+'%';
    if(done===0){
      el('finalScore').textContent='1問も回答していません';
    }else{
      el('finalScore').textContent=score+' / '+done+' 問正解'
        + (partial ? '（中断：全'+total+'問中 '+done+'問まで）' : '（全'+total+'問 完了）');
    }
    // カテゴリ別の誤答集計
    const wrongByCat={};
    wrong.forEach(q=>{wrongByCat[q.cat]=(wrongByCat[q.cat]||0)+1;});
    const cb=el('catBreak');
    if(done===0){ cb.innerHTML='<div>（回答なし）</div>'; }
    else if(wrong.length===0){ cb.innerHTML='<div>🎉 回答した'+done+'問は全問正解！</div>'; }
    else{
      cb.innerHTML='<div>間違えたカテゴリ:</div>'+
        Object.entries(wrongByCat).map(([c,n])=>'<div>・'+c+'：'+n+'問</div>').join('');
    }
    el('retryWrongBtn').style.display = wrong.length? '' : 'none';
  }

  el('startBtn').onclick=()=>{
    saveUser(el('userNameInput').value.trim());
    if(!loadUser()){
      if(!confirm('名前が未入力です。分析で誰のデータか区別できません。このまま始めますか？')){
        el('userNameInput').focus(); return;
      }
    }
    mode=el('modeSel').value; start(buildPool());
  };
  el('nextBtn').onclick=next;
  el('quitBtn').onclick=finish;
  el('againBtn').onclick=()=>{el('result').classList.add('hidden');el('start').classList.remove('hidden');el('mydata').classList.remove('hidden');refreshDataSummary();};
  el('retryWrongBtn').onclick=()=>start(shuffle(wrong));

  // ===== マイ学習データ：集計・分析・書き出し =====
  function refreshDataSummary(){
    const log = loadLog();
    const n = log.length;
    const correct = log.filter(r=>r.correct).length;
    const rate = n ? Math.round(correct/n*100) : 0;
    el('dataSummary').textContent = n ? ('累計 '+n+'回答 ・ 正答率 '+rate+'%') : 'まだ回答履歴がありません';
    el('overallbar').style.width = rate+'%';
  }

  function analyze(){
    const log = loadLog();
    const box = el('analysis');
    if(log.length===0){ box.innerHTML='<div>履歴がありません。クイズを解くと溜まります。</div>'; return; }

    // サービス別 正答率（回答2回以上を対象に、正答率が低い順）
    const bySvc={};
    log.forEach(r=>{ (bySvc[r.svc]=bySvc[r.svc]||{n:0,ok:0}); bySvc[r.svc].n++; if(r.correct) bySvc[r.svc].ok++; });
    const weakSvc = Object.entries(bySvc)
      .map(([svc,v])=>({svc,n:v.n,ok:v.ok,rate:Math.round(v.ok/v.n*100)}))
      .filter(x=>x.n>=1)
      .sort((a,b)=> a.rate-b.rate || b.n-a.n)
      .slice(0,8);

    // カテゴリ別 正答率
    const byCat={};
    log.forEach(r=>{ (byCat[r.cat]=byCat[r.cat]||{n:0,ok:0}); byCat[r.cat].n++; if(r.correct) byCat[r.cat].ok++; });
    const catRows = Object.entries(byCat)
      .map(([cat,v])=>({cat,n:v.n,rate:Math.round(v.ok/v.n*100)}))
      .sort((a,b)=>a.rate-b.rate);

    // 取り違えペア（正解svc ← 選んだ誤答svc）
    const conf={};
    log.filter(r=>!r.correct && r.chosenSvc).forEach(r=>{
      const k=r.svc+' ⟵ '+r.chosenSvc;
      conf[k]=(conf[k]||0)+1;
    });
    const confRows = Object.entries(conf).sort((a,b)=>b[1]-a[1]).slice(0,8);

    let h='';
    h+='<div style="margin:6px 0 2px;color:var(--ng)"><b>弱いサービス（正答率が低い順）</b></div>';
    h+=weakSvc.map(x=>'<div>・'+x.svc+'：'+x.rate+'%（'+x.ok+'/'+x.n+'）</div>').join('');
    h+='<div style="margin:10px 0 2px;color:var(--accent)"><b>カテゴリ別 正答率</b></div>';
    h+=catRows.map(x=>'<div>・'+x.cat+'：'+x.rate+'%（'+x.n+'回答）</div>').join('');
    if(confRows.length){
      h+='<div style="margin:10px 0 2px;color:#f59e0b"><b>混同しやすいペア（正解 ⟵ 選んだ誤答）</b></div>';
      h+=confRows.map(([k,c])=>'<div>・'+k+'：'+c+'回</div>').join('');
    }
    box.innerHTML=h;
  }

  function exportData(){
    const log = loadLog();
    const payload = {
      meta: { title:'SAP-C02 クイズ 学習ログ', exported: new Date().toISOString(), totalAnswers: log.length },
      log: log
    };
    const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const d = new Date();
    const pad=x=>String(x).padStart(2,'0');
    a.href=url;
    a.download='sap-c02-quizlog_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  el('analyzeBtn').onclick=analyze;
  el('exportBtn').onclick=exportData;
  el('clearBtn').onclick=()=>{
    if(confirm('このブラウザの学習履歴を全部消します。よろしいですか？')){
      saveLog([]); refreshDataSummary(); el('analysis').innerHTML='<div>履歴を消去しました。</div>';
    }
  };
  refreshDataSummary();
})();
</script>
</body>
</html>
